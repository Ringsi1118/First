<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Signup Wrapper -->
  <div class="signup-wrapper" style="position: relative; width: 350px; margin: auto;">

    <!-- Monkey ABOVE container -->
    <div class="monkey-wrapper">
      <div class="monkey">
        <div class="ear left"></div>
        <div class="ear right"></div>

        <div class="face">
          <div class="eye left"></div>
          <div class="eye right"></div>
        </div>

        <div class="hand left-hand"></div>
        <div class="hand right-hand"></div>
      </div>
    </div>

    <!-- Signup Card -->
    <div class="container">
      <h2 class="title">Create Account</h2>
      <p class="subtitle">Start your journey</p>

      <form class="form">
        <div class="input-box">
          <input type="text" required>
          <label>Username</label>
        </div>

        <div class="input-box">
          <input type="email" required>
          <label>Email</label>
        </div>

        <div class="input-box">
          <input type="password" id="password" required>
          <label>Password</label>
        </div>

        <button type="submit">Sign Up</button>
      </form>

      <p class="switch">
        Already have an account?
        <a href="login.html">Login</a>
      </p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
